<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Organiza+ | Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="brand" href="dashboard.html">Organiza+</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="disciplinas.html">Disciplinas</a>
      <a href="tarefas.html">Tarefas</a>
      <button class="btn-secondary" onclick="logout()">Sair</button>
    </div>
  </div>
</nav>

  <main class="container">
    <h1>Tarefas</h1>
    <section class="two-cols">
      <div class="card">
        <h2>Nova tarefa</h2>
        <form id="taskForm">
          <label>Título</label>
          <input name="title" required>
          <label>Descrição</label>
          <textarea name="description"></textarea>
          <label>Disciplina</label>
          <select id="discipline_id" name="discipline_id"></select>
          <label>Prazo</label>
          <input type="date" name="due_date">
          <label>Prioridade</label>
          <select name="priority">
            <option>Baixa</option>
            <option selected>Média</option>
            <option>Alta</option>
          </select>
          <button class="btn-primary full" type="submit">Cadastrar tarefa</button>
        </form>
        <p id="message" class="message"></p>
      </div>
      <div class="card">
        <h2>Tarefas cadastradas</h2>
        <div id="taskList" class="list"></div>
      </div>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/tarefas.js"></script>
</body>
</html>
