<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Organiza+ | Disciplinas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="brand" href="dashboard.html">Organiza+</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="disciplinas.html">Disciplinas</a>
      <a href="tarefas.html">Tarefas</a>
      <button class="btn-secondary" onclick="logout()">Sair</button>
    </div>
  </div>
</nav>

  <main class="container">
    <h1>Disciplinas</h1>
    <section class="two-cols">
      <div class="card">
        <h2>Nova disciplina</h2>
        <form id="disciplineForm">
          <label>Nome</label>
          <input name="name" placeholder="Ex.: Engenharia de Software" required>
          <button class="btn-primary full" type="submit">Cadastrar</button>
        </form>
        <p id="message" class="message"></p>
      </div>
      <div class="card">
        <h2>Disciplinas cadastradas</h2>
        <div id="disciplineList" class="list"></div>
      </div>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/disciplinas.js"></script>
</body>
</html>
